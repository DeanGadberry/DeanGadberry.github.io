<!DOCTYPE html>

<style>
    @font-face {
        font-family: glacial-indifference;
        src: url('static/GlacialIndifference-Regular.otf');
    }
    @font-face {
        font-family: montserrat;
        src: url('static/Montserrat-Regular.ttf');

    h1 {
        font-family: glacial-indifference, montserrat, sans-serif;
    }

      }

      .divvy-div-div img {

      }
      .divvy-div-div p {
        font-size: 1rem;
      }
    }

      .divvy-div-div {
        max-width: 50%;
      }
      .divvy-div-div h1 {
        font-size: 2.3rem;
      }
      .divvy-div-div p {
