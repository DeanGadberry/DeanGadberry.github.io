<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible"
        content="IE=edge">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
    <meta property="og:title"
        content="Dean Gadberry Contact" />
    <meta property="og:image"
        content="https://www.deangadberry.com/assets/dg-share.gif" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/gif" />
    <title>Dean Gadberry</title>
    <link rel="icon"
        href="assets/favicon.ico">
    <link rel="stylesheet" href="styles/rain.css">
<style>
    @font-face {
        font-family: 'EB Garamond';
        src: url('static/EBGaramond-Regular.ttf') format('truetype');
        font-weight: 400;
    }
    @font-face {
        font-family: 'EB Garamond';
        src: url('static/EBGaramond-SemiBold.ttf') format('truetype');
        font-weight: 600;
    }
    @font-face {
        font-family: 'EB Garamond';
        src: url('static/EBGaramond-Bold.ttf') format('truetype');
        font-weight: 700;
    }
    :root {
        --ink: #1c2420;
        --bg: #f6f3ec;
    }
    html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--ink);
    }
    h1 {
        font-family: 'EB Garamond', Georgia, serif;
        font-weight: 700;
        color: var(--ink);
        margin: 0.3em 0 0.2em;
    }
    p {
        font-family: 'EB Garamond', Georgia, serif;
        color: var(--ink);
    }
    .page {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        width: 100%;
        min-height: 100vh;
        padding: 40px 20px;
        box-sizing: border-box;
        pointer-events: none;
    }
    .card {
        position: relative;
        pointer-events: auto;
        background: rgba(253, 251, 247, 0.22);
        backdrop-filter: blur(12px) saturate(140%);
        -webkit-backdrop-filter: blur(12px) saturate(140%);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 28px;
        box-shadow: 0 40px 80px -30px rgba(28, 36, 32, 0.35), 0 2px 10px rgba(28, 36, 32, 0.08);
        padding: 48px 40px;
    }
    @media (max-width: 599px) {
      .card {
        max-width: 87%;
        padding: 36px 24px;
      }
      .card h1 {
        font-size: 1.7rem;
      }
      .card .logo {
        max-width: 75%;
      }
      .card p {
        font-size: 1.05rem;
      }
    }
    @media (min-width: 600px) {
      .card {
        max-width: 75%;
        padding: 44px 36px;
      }
      .card h1 {
        font-size: 1.9rem;
      }
      .card .logo {
        max-width: 65%;
      }
      .card p {
        font-size: 1.1rem;
      }
    }
    @media (min-width: 900px) {
      .card {
        max-width: 500px;
      }
      .card h1 {
        font-size: 2.5rem;
      }
      .card p {
        font-size: 1.4rem;
      }
    }
    a {
        color: var(--ink);
        text-decoration: none;
        font-weight: 600;
    }
    a:hover {
        color: #8C8CF7;
    }
</style>
</head>

<body>
    <div class="rain" id="rain" aria-hidden="true"></div>
    <div class="page">
        <div class="card">
        <img class="logo" src="assets/dg-monogram.svg" alt="Dean Gadberry monogram" style="width: 40%; height: auto;">
        <h1>Dean Gadberry</h1>
        <p><a
            href="mailto:dean@deangadberry.com"
            target="_blank"
            rel="noreferrer noopener" >
            dean@deangadberry.com
        </a></p>
         <p><a
            href="https://linkedin.com/in/DeanGadberry"
            target="_blank"
            rel="noreferrer noopener" >
            LinkedIn.com/in/DeanGadberry
        </a></p>
        <p><a
            href="books"
            target="_blank"
            rel="noreferrer noopener" >
            Dean's List of Books
        </a></p>
        <p><a
            href="chirho"
            target="_blank"
            rel="noreferrer noopener" >
            Chi-Rho Cards
        </a></p>
    </div>
    </div>
    <script src="static/rain.js"></script>
    <script>
        initRain({
            containerId: 'rain',
            images: [
                'assets/rain/fisterra_handstand.jpg',
                'assets/rain/gorkha.jpg',
                'assets/rain/gorkha_alone.jpg',
                'assets/rain/kathmandu_kids.jpg',
                'assets/rain/pelican.jpg',
                'assets/rain/plants.jpg',
                'assets/rain/pokhara_friend.jpg',
                'assets/rain/pool.jpg',
                'assets/rain/roadster-cropped.jpg',
                'assets/rain/spain_dog.jpg',
                'assets/rain/goat-hug.jpg',
                'assets/rain/guitar-sing.jpg',
                'assets/rain/arm-around-friend.jpg',
                'assets/rain/mountain-overlook.jpg',
                'assets/rain/wedding-toast.jpg',
                'assets/rain/family-hike.jpg',
                'assets/rain/childhood-car.jpg',
                'assets/rain/cabinet-celebration.jpg',
                'assets/rain/lake-engagement.jpg',
                'assets/rain/spectrum-coworkers.jpg',
                'assets/rain/state-fair.jpg',
                'assets/rain/guitar-busker.jpg',
                'assets/rain/formal-couple.jpg',
                'assets/rain/bw-embrace.jpg'
            ],
            count: 26,
            minDur: 55,
            maxDur: 100
        });
    </script>
</body>
</html>
