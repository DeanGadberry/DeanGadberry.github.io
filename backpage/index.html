<style>
     @font-face {
        font-family: 'EB Garamond';
        src: url('../static/EBGaramond-Regular.ttf') format('truetype');
        font-weight: 400;
     }
     @font-face {
        font-family: 'EB Garamond';
        src: url('../static/EBGaramond-SemiBold.ttf') format('truetype');
        font-weight: 600;
     }
     @font-face {
        font-family: 'EB Garamond';
        src: url('../static/EBGaramond-Bold.ttf') format('truetype');
        font-weight: 700;
     }

     :root {
        --ink: #1c2420;
        --bg: #f6f3ec;
     }

     html, body {
         margin: 0;
         padding: 0;
         width: 100%;
         min-height: 100%;
         background-color: var(--bg);
         color: var(--ink);
     }

     body {
         display: flex;
         align-items: center;
         justify-content: center;
         box-sizing: border-box;
         padding: 30px 15px;
     }

     .card {
         width: 100%;
         max-width: 640px;
         text-align: left;
         font-family: 'EB Garamond', Georgia, serif;
         background: rgba(253, 251, 247, 0.4);
         border: 1px solid rgba(255, 255, 255, 0.6);
         border-radius: 28px;
         box-shadow: 0 40px 80px -30px rgba(28, 36, 32, 0.35), 0 2px 10px rgba(28, 36, 32, 0.08);
         padding: 40px 36px;
         box-sizing: border-box;
     }

     .back-link {
        display: inline-block;
        margin-bottom: 18px;
        font-size: 0.95rem;
     }

     .logo {
         display: block;
         margin: 0 auto 15px auto;
         width: 75px;
         height: auto;
     }

     h1 {
        font-family: 'EB Garamond', Georgia, serif;
        font-weight: 700;
        color: var(--ink);
        text-align: center;
        margin: 0 0 28px;
        font-size: 1.6rem;
     }

     h3 {
         font-family: 'EB Garamond', Georgia, serif;
         font-weight: 700;
         color: var(--ink);
         font-size: 1.1rem;
         opacity: 0.75;
         margin: 30px 0 16px 0;
         padding-top: 18px;
         border-top: 1px solid rgba(28, 36, 32, 0.2);
         text-align: center;
     }

     .grid {
         display: grid;
         grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
         gap: 20px 8px;
     }

     .app {
         display: flex;
         flex-direction: column;
         align-items: center;
         text-align: center;
         text-decoration: none;
         color: var(--ink);
     }

     .app .icon {
         display: block;
         width: 56px;
         height: 56px;
         border-radius: 14px;
         box-shadow: 0 6px 14px -6px rgba(28, 36, 32, 0.45), 0 1px 3px rgba(28, 36, 32, 0.15);
         transition: transform 0.15s ease;
     }

     .app .icon svg,
     .app .icon img {
         display: block;
         width: 56px;
         height: 56px;
     }

     .app:hover .icon {
         transform: translateY(-3px) scale(1.04);
     }

     .app .label {
         margin-top: 7px;
         font-size: 0.78rem;
         font-weight: 600;
         line-height: 1.25;
     }

     .grid-old .icon {
         opacity: 0.8;
     }

     a {
         color: var(--ink);
         text-decoration: none;
         font-weight: 600;
     }

     a:hover {
         color: #8C8CF7;
     }
</style>
</head>
