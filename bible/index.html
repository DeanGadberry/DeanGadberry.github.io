<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Bible</title>
    <link rel="icon" href="../assets/favicon.ico">
<style>
     @font-face {
        font-family: 'EB Garamond';
        src: url('../static/EBGaramond-Regular.ttf') format('truetype');
        font-weight: 400;
     }
     @font-face {
        font-family: 'EB Garamond';
        src: url('../static/EBGaramond-SemiBold.ttf') format('truetype');
        font-weight: 600;
     }
     @font-face {
        font-family: 'EB Garamond';
        src: url('../static/EBGaramond-Bold.ttf') format('truetype');
        font-weight: 700;
     }

     :root {
        --ink: #1c2420;
        --bg: #f6f3ec;
     }

     html, body {
         margin: 0;
         padding: 0;
         width: 100%;
         min-height: 100%;
         background-color: var(--bg);
         color: var(--ink);
     }

     body {
         display: flex;
         align-items: center;
         justify-content: center;
         box-sizing: border-box;
         min-height: 100vh;
         padding: 30px 15px;
     }

     .card {
         width: 100%;
         max-width: 560px;
         text-align: left;
         font-family: 'EB Garamond', Georgia, serif;
         background: rgba(253, 251, 247, 0.4);
         border: 1px solid rgba(255, 255, 255, 0.6);
         border-radius: 28px;
         box-shadow: 0 40px 80px -30px rgba(28, 36, 32, 0.35), 0 2px 10px rgba(28, 36, 32, 0.08);
         padding: 40px 44px;
         box-sizing: border-box;
     }

     h1 {
        font-weight: 700;
        text-align: center;
        margin: 0 0 24px;
        font-size: 1.6rem;
     }

     ul.links {
         margin: 0;
         padding-left: 22px;
         font-size: 1.05rem;
         line-height: 1.55;
     }

     a {
         color: var(--ink);
         text-decoration: none;
         font-weight: 600;
     }

     a:hover {
         color: #8C8CF7;
     }
</style>
</head>
<body>
    <div class="card">
        <h1>Bible</h1>

        <ul class="links">
            <li><a href="28-day-dmm-creation-to-christ/">28 Day DMM Creation to Christ</a></li>
        </ul>
    </div>
</body>
</html>
